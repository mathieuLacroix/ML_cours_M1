<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;anthropic-sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Schéma montrant le passage forward à travers un réseau : x = h0 entre dans la couche 1, produit h1, qui entre dans la couche 2, produit h2, puis après des points de suspension représentant d'autres couches, h_{l-1} entre dans la couche l pour produire y = h_l.</desc>
