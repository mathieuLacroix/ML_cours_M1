name: Deploy Jupyter Book
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  BASE_URL: /${{ github.event.repository.name }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Cache execution results
        uses: actions/cache@v4
        with:
          path: _build/execute
          key: jb-execute-${{ hashFiles('**/*.ipynb', '**/*.md', 'uv.lock') }}
          restore-keys: jb-execute-

      - name: Build HTML (with execution)
        run: uv run jupyter book build --html --execute

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

      - id: deployment
        uses: actions/deploy-pages@v4